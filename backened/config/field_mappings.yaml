    - name: cveMetadata_cveId
      type: string
      max_length: 50
      required: true
      description: "CVE ID (e.g., CVE-2024-12345)"
      extraction_rules:
        - selector: "meta[name='cve-id']"
          attribute: "content"
        - regex: "CVE-\\d{4}-\\d+"
    
    - name: cveMetadata_state
      type: string
      max_length: 50
      description: "CVE状态 (PUBLISHED, REJECTED, etc.)"
      extraction_rules:
        - json_path: "cveMetadata.state"
        - selector: ".cve-state"
    
    - name: cveMetadata_assignerOrgId
      type: string
      max_length: 255
      description: "CVE分配机构ID"
      extraction_rules:
        - json_path: "cveMetadata.assignerOrgId"
    
    - name: cveMetadata_assignerShortName
      type: string
      max_length: 255
      description: "CVE分配机构简称"
      extraction_rules:
        - json_path: "cveMetadata.assignerShortName"
    
    - name: cveMetadata_dateReserved
      type: datetime
      description: "CVE保留日期"
      extraction_rules:
        - json_path: "cveMetadata.dateReserved"
    
    - name: cveMetadata_datePublished
      type: datetime
      description: "CVE发布日期"
      extraction_rules:
        - json_path: "cveMetadata.datePublished"
        - selector: "meta[name='datePublished']"
          attribute: "content"
    
    - name: cveMetadata_dateRejected
      type: datetime
      description: "CVE拒绝日期"
      extraction_rules:
        - json_path: "cveMetadata.dateRejected"
    
    - name: cveMetadata_dateUpdated
      type: datetime
      description: "CVE更新日期"
      extraction_rules:
        - json_path: "cveMetadata.dateUpdated"
    
    - name: cveMetadata_requesterUserId
      type: string
      max_length: 255
      description: "CVE请求用户ID"
    
    - name: cveMetadata_serial
      type: integer
      description: "CVE序列号"
    
    - name: dataType
      type: string
      max_length: 50
      description: "数据类型"
    
    - name: dataVersion
      type: string
      max_length: 50
      description: "数据版本"
    
    - name: containers_cna_title
      type: string
      max_length: 500
      description: "CVE标题"
      extraction_rules:
        - json_path: "containers.cna.title"
        - selector: "h1"
        - selector: "title"
    
    - name: containers_cna_affected_product
      type: string
      max_length: 255
      description: "受影响产品"
    
    - name: containers_cna_affected_vendor
      type: string
      max_length: 255
      description: "受影响厂商"
    
    - name: containers_cna_datePublic
      type: datetime
      description: "公开日期"
    
    - name: containers_cna_affected_cpes
      type: text
      description: "受影响的CPE"
    
    - name: containers_cna_descriptions_lang
      type: string
      max_length: 50
      description: "描述语言"
    
    - name: containers_cna_descriptions_value
      type: text
      description: "描述内容"
      extraction_rules:
        - json_path: "containers.cna.descriptions[0].value"
        - selector: ".description"
    
    - name: containers_cna_impacts_descriptions_lang
      type: string
      max_length: 50
      description: "影响描述语言"
    
    - name: containers_cna_impacts_descriptions_value
      type: text
      description: "影响描述内容"
    
    - name: containers_cna_exploits_lang
      type: string
      max_length: 50
      description: "利用代码语言"
    
    - name: containers_cna_exploits_value
      type: text
      description: "利用代码内容"
    
    - name: containers_cna_solutions_lang
      type: string
      max_length: 50
      description: "解决方案语言"
    
    - name: containers_cna_solutions_value
      type: text
      description: "解决方案内容"
    
    - name: containers_cna_workarounds_lang
      type: string
      max_length: 50
      description: "变通方案语言"
    
    - name: containers_cna_workarounds_value
      type: text
      description: "变通方案内容"
    
    - name: containers_cna_timeline_lang
      type: string
      max_length: 50
      description: "时间线语言"
    
    - name: containers_cna_timeline_value
      type: text
      description: "时间线内容"
    
    - name: containers_cna_metrics_other_type
      type: string
      max_length: 255
      description: "其他指标类型"
    
    - name: containers_cna_source_lang
      type: string
      max_length: 50
      description: "来源语言"
    
    - name: containers_cna_source_value
      type: string
      max_length: 255
      description: "来源值"
    
    - name: containers_cna_references_name
      type: string
      max_length: 255
      description: "参考名称"
    
    - name: containers_cna_references_tags
      type: string
      max_length: 255
      description: "参考标签"
    
    - name: containers_cna_references_url
      type: string
      max_length: 512
      description: "参考URL"
      extraction_rules:
        - selector: "a[href*='reference']"
          attribute: "href"

