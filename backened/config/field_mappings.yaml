# CNVD漏洞库配置
cnvd:
  table_name: t_cnvd_info
  id_field: cnvd_id
  id_pattern: "CNVD-\\d{4}-\\d+"
  
  fields:
    - name: cnvd_id
      type: string
      max_length: 50
      required: true
      description: "CNVD ID (e.g., CNVD-2024-12345)"
      extraction_rules:
        - selector: "td:contains('CNVD-ID') + td"
        - regex: "CNVD-\\d{4}-\\d+"
    
    - name: Publicdate
      type: datetime
      description: "公开日期"
      extraction_rules:
        - selector: "td:contains('公开日期') + td"
        - selector: "td:contains('发布时间') + td"
    
    - name: severity
      type: string
      max_length: 50
      description: "严重程度"
      extraction_rules:
        - selector: "td:contains('危害级别') + td"
        - selector: "td:contains('严重程度') + td"
    
    - name: products
      type: text
      description: "受影响产品"
      extraction_rules:
        - selector: "td:contains('受影响产品') + td"
        - selector: "td:contains('影响产品') + td"
    
    - name: cveid
      type: string
      max_length: 50
      description: "关联的CVE ID"
      extraction_rules:
        - regex: "CVE-\\d{4}-\\d+"
    
    - name: description
      type: text
      description: "漏洞描述"
      extraction_rules:
        - selector: ".vuln-description"
        - selector: "td:contains('漏洞描述') + td"
    
    - name: vulnerabilitiestype
      type: string
      max_length: 255
      description: "漏洞类型"
      extraction_rules:
        - selector: "td:contains('漏洞类型') + td"
    
    - name: referenceLink
      type: string
      max_length: 512
      description: "参考链接"
      extraction_rules:
        - selector: "td.alignRight:contains('参考链接') + td"
    
    - name: solutions
      type: text
      description: "漏洞解决方案"
      extraction_rules:
        - selector: "td.alignRight:contains('漏洞解决方案') + td"
        - selector: "td:contains('解决方案') + td"
        - selector: ".solution"
    
    - name: Vendor Patch
      type: text
      description: "厂商补丁"
      extraction_rules:
        - selector: "td.alignRight:contains('厂商补丁') + td"
    
    - name: Verification Information
      type: text
      description: "验证信息"
      extraction_rules:
        - selector: "td.alignRight:contains('验证信息') + td"
    
    - name: submitTime
      type: datetime
      description: "报送时间"
      extraction_rules:
        - selector: "td.alignRight:contains('报送时间') + td"
    
    - name: collectionTime
      type: datetime
      description: "收录时间"
      extraction_rules:
        - selector: "td.alignRight:contains('收录时间') + td"
    
    - name: updateTime
      type: datetime
      description: "更新时间"
      extraction_rules:
        - selector: "td.alignRight:contains('更新时间') + td"
    
    - name: Vulnerability Attachment
      type: text
      description: "漏洞附件"
      extraction_rules:
        - selector: "td.alignRight:contains('漏洞附件') + td"

# CISA漏洞库配置
cisa:
  table_name: t_cisa_info
  id_field: cveID
  id_pattern: "CVE-\\d{4}-\\d+"
  
  fields:
    - name: cveID
      type: string
      max_length: 50
      required: true
      description: "CVE ID"
      extraction_rules:
        - regex: "CVE-\\d{4}-\\d+"
        - selector: "meta[name='cve-id']"
          attribute: "content"
    
    - name: vendorProject
      type: string
      max_length: 255
      description: "厂商项目名称"
      extraction_rules:
        - selector: "td:contains('Vendor') + td"
        - selector: ".vendor-project"
    
    - name: product
      type: string
      max_length: 255
      description: "产品名称"
      extraction_rules:
        - selector: "td:contains('Product') + td"
        - selector: ".product-name"
    
    - name: vulnerabilityName
      type: string
      max_length: 500
      description: "漏洞名称"
      extraction_rules:
        - selector: "h1"
        - selector: ".vulnerability-name"
        - selector: "title"
    
    - name: dateAdded
      type: datetime
      description: "添加日期"
      extraction_rules:
        - selector: "td:contains('Date Added') + td"
        - selector: ".date-added"
    
    - name: shortDescription
      type: text
      description: "简短描述"
      extraction_rules:
        - selector: ".short-description"
        - selector: "meta[name='description']"
          attribute: "content"
    
    - name: requiredAction
      type: text
      description: "要求的行动"
      extraction_rules:
        - selector: "td:contains('Required Action') + td"
        - selector: ".required-action"
    
    - name: dueDate
      type: datetime
      description: "截止日期"
      extraction_rules:
        - selector: "td:contains('Due Date') + td"
        - selector: ".due-date"
    
    - name: knownRansomwareCampaignUse
      type: string
      max_length: 50
      description: "已知勒索软件使用情况 (Unknown/Yes/No)"
      extraction_rules:
        - selector: "td:contains('Known Ransomware') + td"
    
    - name: notes
      type: text
      description: "备注"
      extraction_rules:
        - selector: ".notes"
        - selector: "td:contains('Notes') + td"
    
    - name: cwes
      type: string
      max_length: 255
      description: "CWE ID"
      extraction_rules:
        - regex: "CWE-\\d+"

# CERT漏洞库配置
cert:
  table_name: t_cert_info
  id_field: vuid
  id_pattern: "VU#\\d+"
  
  fields:
    - name: vuid
      type: string
      max_length: 50
      required: true
      description: "CERT漏洞ID (e.g., VU#123456)"
      extraction_rules:
        - regex: "VU#\\d+"
    
    - name: idnumber
      type: string
      max_length: 50
      description: "编号"
    
    - name: name
      type: string
      max_length: 255
      description: "漏洞标题"
      extraction_rules:
        - selector: "title"
        - selector: "h1"
        - selector: "meta[property='og:title']"
          attribute: "content"
    
    - name: keywords
      type: string
      max_length: 255
      description: "关键词"
      extraction_rules:
        - selector: "meta[name='keywords']"
          attribute: "content"
    
    - name: overview
      type: text
      description: "概述"
      extraction_rules:
        - selector: "#overview + div.vulcontent"
        - selector: "#overview + .vulcontent"
        - selector: "h3#overview ~ div.vulcontent"
    
    - name: clean_desc
      type: text
      description: "详细描述"
      extraction_rules:
        - selector: "#description + p"
        - selector: "h3#description ~ p"
        - selector: "meta[name='Description']"
          attribute: "content"
    
    - name: impact
      type: text
      description: "影响"
      extraction_rules:
        - selector: "#impact + p"
        - selector: "h3#impact ~ p"
    
    - name: resolution
      type: text
      description: "解决方案"
      extraction_rules:
        - selector: "#solution + p"
        - selector: "h3#solution ~ p"
        - selector: "#resolution + p"
    
    - name: workarounds
      type: text
      description: "变通方案"
      extraction_rules:
        - selector: "#workaround + p"
        - selector: "h3:contains('Workaround') ~ p"
    
    - name: sysaffected
      type: text
      description: "受影响系统"
      extraction_rules:
        - selector: "#systems-affected + p"
        - selector: "h3:contains('Systems Affected') ~ p"
    
    - name: cveids
      type: string
      max_length: 255
      description: "关联的CVE ID列表"
      extraction_rules:
        - regex: "CVE-\\d{4}-\\d+"
    
    - name: datecreated
      type: datetime
      description: "创建日期"
    
    - name: publicdate
      type: datetime
      description: "公开日期"
      extraction_rules:
        - selector: "meta[name='sei_date_published']"
          attribute: "content"
        - selector: "meta[name='published_at']"
          attribute: "content"
    
    - name: datefirstpublished
      type: datetime
      description: "首次发布日期"
    
    - name: dateupdated
      type: datetime
      description: "更新日期"
    
    - name: revision
      type: string
      max_length: 50
      description: "修订版本"
    
    - name: cam_widelyknown
      type: boolean
      description: "是否广泛知晓"
    
    - name: cam_exploitation
      type: boolean
      description: "是否被利用"
    
    - name: cam_internetinfrastructure
      type: boolean
      description: "是否影响互联网基础设施"
    
    - name: cam_scorecurrent
      type: float
      description: "当前评分"
    
    - name: ipprotocol
      type: string
      max_length: 50
      description: "IP协议"
    
    - name: cvss_accessvector
      type: string
      max_length: 255
      description: "CVSS访问向量"
    
    - name: cvss_accesscomplexity
      type: string
      max_length: 255
      description: "CVSS访问复杂度"
    
    - name: cvss_authentication
      type: string
      max_length: 255
      description: "CVSS认证要求"
    
    - name: cvss_confidentialityimpact
      type: string
      max_length: 255
      description: "CVSS机密性影响"
    
    - name: cvss_integrityimpact
      type: string
      max_length: 255
      description: "CVSS完整性影响"
    
    - name: cvss_availabilityimpact
      type: string
      max_length: 255
      description: "CVSS可用性影响"
    
    - name: cvss_exploitablity
      type: float
      description: "CVSS可利用性"
    
    - name: cvss_basescore
      type: float
      description: "CVSS基础评分"
    
    - name: cvss_basevector
      type: string
      max_length: 255
      description: "CVSS基础向量"
    
    - name: vulnote
      type: text
      description: "漏洞说明"

# JVN漏洞库配置
jvn:
  table_name: t_jvn_info
  id_field: jvn_number
  id_pattern: "(JVN#\\d+|JVNVU#\\d+|CPNI-\\d+|NISCC-\\d+|JVNTA\\d+-\\d+[A-Z]*(\\(\\d+\\))?)"
  
  fields:
    - name: jvn_number
      type: string
      max_length: 50
      required: true
      description: "JVN编号 (e.g., JVN#12345678)"
      extraction_rules:
        - regex: "JVN#\\d+"
        - selector: "meta[name='jvn-id']"
          attribute: "content"
    
    - name: title
      type: string
      max_length: 500
      description: "漏洞标题"
      extraction_rules:
        - selector: "h1"
        - selector: "title"
        - selector: "meta[property='og:title']"
          attribute: "content"
    
    - name: critical
      type: string
      max_length: 50
      description: "严重程度"
      extraction_rules:
        - selector: ".critical"
        - selector: "td:contains('深刻度') + td"
    
    - name: published_date
      type: datetime
      description: "发布日期"
      extraction_rules:
        - selector: "meta[name='published_date']"
          attribute: "content"
        - selector: "td:contains('公表日') + td"
    
    - name: last_updated
      type: datetime
      description: "最后更新日期"
      extraction_rules:
        - selector: "meta[name='last_updated']"
          attribute: "content"
        - selector: "td:contains('最終更新日') + td"
    
    - name: overview
      type: text
      description: "概要"
      extraction_rules:
        - selector: ".overview"
        - selector: "#overview"
        - selector: "h3:contains('概要') ~ p"
    
    - name: Affected Systems/Products
      type: text
      description: "受影响系统/产品"
      extraction_rules:
        - selector: "h3:contains('対象') ~ div"
        - selector: ".affected-products"
    
    - name: description
      type: text
      description: "漏洞描述"
      extraction_rules:
        - selector: ".description"
        - selector: "meta[name='description']"
          attribute: "content"

    - name: related_cve_ids
      type: string
      max_length: 512
      description: "从description提取的关联CVE，多个用|分隔"
    
    - name: impact
      type: text
      description: "想定される影響（预期影响）"
      extraction_rules:
        - selector: "h3:contains('想定される影響') ~ p"
        - selector: ".impact"
    
    - name: solutions
      type: text
      description: "対策（对策/解决方案）"
      extraction_rules:
        - selector: "h3:contains('対策') ~ div"
        - selector: ".solutions"
    
    - name: workaround
      type: text
      description: "変通方案"
      extraction_rules:
        - selector: "h3:contains('ワークアラウンド') ~ p"
        - selector: ".workaround"
    
    - name: vendor_name
      type: string
      max_length: 255
      description: "厂商名称"
      extraction_rules:
        - selector: ".vendor-name"
        - selector: "td:contains('ベンダ') + td"
    
    - name: vendor_status
      type: string
      max_length: 255
      description: "厂商状态"
    
    - name: vendor_lastupdateddate
      type: string
      max_length: 512
      description: "厂商最后更新日期（多个用 | 分隔）"
    
    - name: vendor_notes
      type: text
      description: "厂商备注"
    
    - name: cvss_v_accessvector
      type: string
      max_length: 255
      description: "CVSS攻击路径（旧版评价表格-攻撃経路）"

    - name: cvss_v_privilegesrequired
      type: string
      max_length: 255
      description: "CVSS认证级别（旧版评价表格-認証レベル）"

    - name: cvss_v_userinteraction
      type: string
      max_length: 255
      description: "CVSS用户参与（旧版评价表格-ユーザ関与）"

    - name: cvss_v_attackcomplexity
      type: string
      max_length: 255
      description: "CVSS攻击难度（旧版评价表格-攻撃の難易度）"
    
    - name: cvss_v3_base_score
      type: float
      description: "CVSS3基础评分"
      extraction_rules:
        - selector: ".cvss-v3-score"
        - regex: "CVSS:3\\.\\d/[^\\s]+/Base:(\\d+\\.\\d+)"
    
