      - name: containers_cna_metrics_cvssV3_0_attackComplexity
        type: string
        max_length: 255
        description: "攻击复杂度"
      
      - name: containers_cna_metrics_cvssV3_0_attackVector
        type: string
        max_length: 255
        description: "攻击向量"
      
      - name: containers_cna_metrics_cvssV3_0_availabilityImpact
        type: string
        max_length: 255
        description: "可用性影响"
      
      - name: containers_cna_metrics_cvssV3_0_baseScore
        type: float
        description: "基础评分"
      
      - name: containers_cna_metrics_cvssV3_0_baseSeverity
        type: string
        max_length: 50
        description: "基础严重程度"
      
      - name: containers_cna_metrics_cvssV3_0_vectorString
