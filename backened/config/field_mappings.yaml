# 字段映射配置文件
# Field Mappings Configuration for 6 Vulnerability Sources

# CVE漏洞库配置
cve:
  table_name: t_cve_main
  id_field: cveMetadata_cveId
  id_pattern: "CVE-\\d{4}-\\d+"
  has_subtable: true
  subtable:
    name: t_cve_metrics
    foreign_key: cve_id
    fields:
      - name: cve_id
        type: string
        max_length: 50
        required: true
        description: "CVE ID (外键)"
      
      # CVSS v2.0 字段
      - name: containers_cna_metrics_cvssV2_0_accessComplexity
        type: string
        max_length: 255
        description: "访问复杂度"
      
      - name: containers_cna_metrics_cvssV2_0_accessVector
        type: string
        max_length: 255
        description: "访问向量"
      
      - name: containers_cna_metrics_cvssV2_0_authentication
        type: string
        max_length: 255
        description: "认证要求"
      
      - name: containers_cna_metrics_cvssV2_0_availabilityImpact
        type: string
        max_length: 255
        description: "可用性影响"
      
      - name: containers_cna_metrics_cvssV2_0_baseScore
        type: float
        description: "基础评分"
      
      - name: containers_cna_metrics_cvssV2_0_confidentialityImpact
        type: string
        max_length: 255
        description: "机密性影响"
      
      - name: containers_cna_metrics_cvssV2_0_integrityImpact
        type: string
        max_length: 255
        description: "完整性影响"
      
      - name: containers_cna_metrics_cvssV2_0_vectorString
        type: string
        max_length: 255
        description: "向量字符串"
      
      - name: containers_cna_metrics_cvssV2_0_version
        type: string
        max_length: 50
        description: "CVSS版本"
      
      # CVSS v3.0 字段
      - name: containers_cna_metrics_cvssV3_0_integrityImpact
        type: string
        max_length: 255
        description: "完整性影响"
      
      - name: containers_cna_metrics_cvssV3_0_scope
        type: string
        max_length: 50
        description: "作用域"
      
      - name: containers_cna_metrics_cvssV3_0_confidentialityImpact
        type: string
        max_length: 255
        description: "机密性影响"
      
      - name: containers_cna_metrics_cvssV3_0_userInteraction
        type: string
        max_length: 50
