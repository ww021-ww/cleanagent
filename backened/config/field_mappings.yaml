    - name: cvss_v3_scope
      type: string
      max_length: 50
      description: "CVSS3作用域"
    
    - name: cvss_v3_confidentialityimpact
      type: string
      max_length: 255
      description: "CVSS3机密性影响"
    
    - name: cvss_v3_integrityimpact
      type: string
      max_length: 255
      description: "CVSS3完整性影响"
    
    - name: cvss_v3_availabilityimpact
      type: string
      max_length: 255
      description: "CVSS3可用性影响"
    
    - name: cvss_v2_base_score
      type: float
      description: "CVSS2基础评分"
    
    - name: cvss_v2_accessvector
      type: string
      max_length: 255
      description: "CVSS2访问向量"
    
    - name: cvss_v2_accesscomplexity
      type: string
      max_length: 255
      description: "CVSS2访问复杂度"
    
    - name: cvss_v2_authentication
      type: string
      max_length: 255
      description: "CVSS2认证要求"
    
    - name: cvss_v2_confidentialityimpact
      type: string
      max_length: 255
      description: "CVSS2机密性影响"
    
    - name: cvss_v2_integrityimpact
      type: string
      max_length: 255
      description: "CVSS2完整性影响"
    
    - name: cvss_v2_availabilityimpact
      type: string
      max_length: 255
      description: "CVSS2可用性影响"
    
    - name: reference_url
      type: string
      max_length: 512
      description: "参考URL"
      extraction_rules:
        - selector: "a[href*='reference']"
          attribute: "href"
    
